limit_req_zone $binary_remote_addr zone=kernelbasher_patch:1m rate=10r/m;
server {
    listen @IP@:80;
    server_name @DOMAIN@;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://@DOMAIN@$request_uri; }
}
server {
    listen @IP@:443 ssl;
    server_name @DOMAIN@;
    ssl_certificate /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root @ROOT@/current/public;
    index index.html;
    client_max_body_size 2m;
    client_body_buffer_size 2m;
    client_body_timeout 20s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Cache-Control "no-cache" always;
    access_log /var/log/nginx/kernelbasher-access.log;
    error_log /var/log/nginx/kernelbasher-error.log;
    location = /kernelbasher { return 301 /kernelbasher/; }
    location ^~ /kernelbasher/api/ {
        limit_req zone=kernelbasher_patch burst=15 nodelay;
        limit_req_status 429;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 35s;
        proxy_send_timeout 25s;
        proxy_pass http://unix:@ROOT@/state/socket/api.sock:/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /kernelbasher/ { try_files $uri $uri/ =404; }
    location / { return 404; }
}
